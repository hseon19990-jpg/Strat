openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operations dashboard
  - name: campaigns
    description: Reaction campaigns
  - name: posts
    description: Posts enrolled in campaigns
  - name: accounts
    description: Account pool status
  - name: activity
    description: Recent reaction activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard-summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a reaction campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update campaign status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List enrolled posts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, queued, processing, completed, failed]
            default: all
      responses:
        "200":
          description: Post list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Enroll a new post in a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get post details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Post details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    post:
      operationId: retryPost
      tags: [posts]
      summary: Retry a failed post
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Post queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List account pool status
      responses:
        "200":
          description: Account status list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Campaign:
      type: object
      required: [id, name, channel, durationDays, reactionsPerPost, status, postsCount, totalReactions, completedReactions, startDate, endDate]
      properties:
        id: { type: integer }
        name: { type: string }
        channel: { type: string }
        durationDays: { type: integer }
        reactionsPerPost: { type: integer }
        status: { type: string, enum: [active, paused, expired] }
        postsCount: { type: integer }
        totalReactions: { type: integer }
        completedReactions: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    CampaignInput:
      type: object
      required: [name, channel, durationDays, reactionsPerPost]
      properties:
        name: { type: string, minLength: 1 }
        channel: { type: string, minLength: 1 }
        durationDays: { type: integer, minimum: 1 }
        reactionsPerPost: { type: integer, minimum: 1 }
    CampaignUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, paused] }
    Post:
      type: object
      required: [id, campaignId, campaignName, channel, telegramUrl, content, publishedAt, targetReactions, completedReactions, status, leaveStatus]
      properties:
        id: { type: integer }
        campaignId: { type: integer }
        campaignName: { type: string }
        channel: { type: string }
        telegramUrl: { type: string }
        content: { type: string }
        publishedAt: { type: string, format: date-time }
        targetReactions: { type: integer }
        completedReactions: { type: integer }
        status: { type: string, enum: [queued, processing, completed, failed] }
        leaveStatus: { type: string, enum: [pending, in_progress, completed] }
    PostInput:
      type: object
      required: [campaignId, channel, telegramUrl, content]
      properties:
        campaignId: { type: integer }
        channel: { type: string, minLength: 1 }
        telegramUrl: { type: string, format: uri }
        content: { type: string, minLength: 1 }
    Account:
      type: object
      required: [id, handle, status, totalReactions, lastAction]
      properties:
        id: { type: integer }
        handle: { type: string }
        status: { type: string, enum: [available, reacting, leaving, cooldown] }
        totalReactions: { type: integer }
        lastAction: { type: string }
    Activity:
      type: object
      required: [id, type, message, createdAt, tone]
      properties:
        id: { type: integer }
        type: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        tone: { type: string, enum: [success, warning, neutral] }
    DashboardSummary:
      type: object
      required: [activeCampaigns, totalPosts, completedPosts, reactionsToday, availableAccounts, queueHealth]
      properties:
        activeCampaigns: { type: integer }
        totalPosts: { type: integer }
        completedPosts: { type: integer }
        reactionsToday: { type: integer }
        availableAccounts: { type: integer }
        queueHealth: { type: number, format: double }

