kind = "web"
previewPath = "/post-reactions/"
title = "Post Reactions Manager"
description = "لوحة عربية لإدارة حملات تفاعلات البوستات، حيث يحصل كل بوست مؤهل على عدد التفاعلات المحدد مرة واحدة ثم تنتقل الحسابات إلى مسار المغادرة."
version = "1.0.0"
id = "artifacts/post-reactions"
router = "path"

[[services]]
name = "web"
paths = [ "/post-reactions" ]
localPort = 19488

[services.development]
run = "pnpm --filter @workspace/post-reactions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/post-reactions", "run", "build" ]
serve = "static"
publicDir = "artifacts/post-reactions/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19488"
BASE_PATH = "/post-reactions/"
